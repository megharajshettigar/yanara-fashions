<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — YANARA Fashion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#222;
    --gold:#c9a96e;--gold2:#a8844a;
    --white:#e8e8e8;--gray:#888;--border:rgba(255,255,255,0.08);
    --font:"Jost","Segoe UI",system-ui,sans-serif;
    --font-display:"Bodoni Moda",Georgia,serif;
    --red:#e05555;
  }
  [data-theme="light"] {
    --bg:#FDFAF5;--bg2:#F5F0E6;--bg3:#EDE6D6;
    --gold:#b8954f;--gold2:#9a7a3c;
    --white:#2A2218;--gray:#9A8E7E;--border:rgba(42,34,24,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--white);font-family:var(--font);min-height:100vh;font-size:14px;line-height:1.6}

  /* ── NAV ── */
  nav{position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 4%;background:var(--bg);border-bottom:1px solid var(--border)}
  .nav-logo{cursor:pointer}
  .nav-logo img{height:36px;width:auto;object-fit:contain;display:block}
  .nav-right{display:flex;align-items:center;gap:16px}
  .nav-back{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);cursor:pointer;text-decoration:none;transition:color .2s}
  .nav-back:hover{color:var(--gold)}
  .theme-btn{background:none;border:none;color:var(--white);cursor:pointer;font-size:18px;display:flex;align-items:center}

  /* ── LAYOUT ── */
  .account-wrap{max-width:900px;margin:0 auto;padding:32px 16px 60px}

  /* ── PROFILE HEADER ── */
  .profile-header{display:flex;align-items:center;gap:20px;padding:28px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;margin-bottom:28px}
  .avatar{width:64px;height:64px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:26px;color:#000;flex-shrink:0}
  .profile-info{flex:1;min-width:0}
  .profile-name{font-family:var(--font-display);font-size:22px;font-weight:400;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .profile-email{font-size:12px;color:var(--gray)}
  .profile-member{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-top:4px}
  .logout-btn{background:none;border:1px solid var(--border);color:var(--gray);padding:8px 16px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-radius:8px;transition:all .2s;white-space:nowrap;font-family:var(--font)}
  .logout-btn:hover{border-color:var(--red);color:var(--red)}

  /* ── TABS ── */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:28px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:12px 20px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;flex-shrink:0}
  .tab.on{color:var(--gold);border-bottom-color:var(--gold)}

  /* ── SECTION ── */
  .tab-section{display:none}
  .tab-section.on{display:block}
  .section-title{font-family:var(--font-display);font-size:18px;font-weight:400;margin-bottom:20px}

  /* ── PROFILE FORM ── */
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gray)}
  .form-group input{background:var(--bg2);border:1px solid var(--border);color:var(--white);padding:10px 14px;font-size:13px;border-radius:8px;font-family:var(--font);outline:none;transition:border .2s}
  .form-group input:focus{border-color:var(--gold)}
  .form-group input:disabled{opacity:0.5;cursor:not-allowed}
  .save-btn{background:var(--gold);color:#000;border:none;padding:11px 28px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:8px;transition:background .2s;font-family:var(--font);margin-top:8px}
  .save-btn:hover{background:var(--gold2)}

  /* ── WISHLIST ── */
  .wishlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
  .wish-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .2s}
  .wish-card:hover{border-color:var(--gold)}
  .wish-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
  .wish-img-ph{width:100%;aspect-ratio:3/4;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:32px}
  .wish-info{padding:10px 12px}
  .wish-name{font-size:12px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wish-price{font-size:12px;color:var(--gold)}
  .wish-remove{width:100%;background:none;border:none;border-top:1px solid var(--border);color:var(--gray);padding:8px;font-size:11px;cursor:pointer;font-family:var(--font);transition:color .2s}
  .wish-remove:hover{color:var(--red)}

  /* ── ORDERS ── */
  .order-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
  .order-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px;flex-wrap:wrap}
  .order-id{font-size:11px;letter-spacing:1px;color:var(--gray)}
  .order-date{font-size:11px;color:var(--gray)}
  .order-status{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px;font-weight:500}
  .status-pending{background:rgba(201,169,110,0.15);color:var(--gold)}
  .status-shipped{background:rgba(50,150,255,0.15);color:#5ba3ff}
  .status-delivered{background:rgba(50,200,100,0.15);color:#50c878}
  .order-items{font-size:13px;margin-bottom:10px}
  .order-total{font-size:13px;font-weight:500;color:var(--gold)}

  /* ── EMPTY STATE ── */
  .empty{text-align:center;padding:60px 20px}
  .empty-icon{font-size:48px;margin-bottom:16px;color:var(--gray)}
  .empty-title{font-family:var(--font-display);font-size:20px;margin-bottom:8px;font-weight:400}
  .empty-sub{font-size:13px;color:var(--gray);margin-bottom:24px}
  .empty-btn{background:var(--gold);color:#000;border:none;padding:11px 28px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:8px;font-family:var(--font)}

  /* ── TOAST ── */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);color:var(--white);padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── LOADING ── */
  .loading{text-align:center;padding:40px;color:var(--gray);font-size:13px}

  /* ── MOBILE ── */
  @media(max-width:600px){
    .form-row{grid-template-columns:1fr}
    .profile-header{flex-direction:column;text-align:center;align-items:center}
    .profile-info{text-align:center}
    .tab{padding:10px 14px;font-size:10px}
    .account-wrap{padding:20px 12px 60px}
    .wishlist-grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .logout-btn{margin-top:8px}
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="window.location.href='index.html'">
    <img src="https://ik.imagekit.io/megharaj/logo/yanara-logo.jpeg" alt="YANARA Fashion" onerror="this.style.display='none'">
  </div>
  <div class="nav-right">
    <a class="nav-back" href="index.html">← Back to Store</a>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn"><i class="ti ti-moon"></i></button>
  </div>
</nav>

<div class="account-wrap">

  <!-- PROFILE HEADER -->
  <div class="profile-header">
    <div class="avatar" id="acc-avatar">U</div>
    <div class="profile-info">
      <div class="profile-name" id="acc-name">—</div>
      <div class="profile-email" id="acc-email">—</div>
      <div class="profile-member">YANARA Member</div>
    </div>
    <button class="logout-btn" onclick="doLogout()">Sign Out</button>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab on" onclick="switchTab('profile')">Profile</div>
    <div class="tab" onclick="switchTab('wishlist')">Wishlist</div>
    <div class="tab" onclick="switchTab('orders')">Orders</div>
  </div>

  <!-- PROFILE TAB -->
  <div class="tab-section on" id="tab-profile">
    <div class="section-title">Personal Information</div>
    <div class="form-row">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="prof-name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="prof-email" placeholder="your@email.com" disabled>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="prof-phone" placeholder="+91 XXXXX XXXXX">
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" id="prof-city" placeholder="Your city">
      </div>
    </div>
    <button class="save-btn" onclick="saveProfile()">Save Changes</button>
  </div>

  <!-- WISHLIST TAB -->
  <div class="tab-section" id="tab-wishlist">
    <div class="section-title">My Wishlist</div>
    <div id="wishlist-content"><div class="loading">Loading...</div></div>
  </div>

  <!-- ORDERS TAB -->
  <div class="tab-section" id="tab-orders">
    <div class="section-title">Order History</div>
    <div id="orders-content"><div class="loading">Loading...</div></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDZBP8TuqZOAOdW8jB4q65gL3rwWxnLonc",
  authDomain: "yanarafashion-54acf.firebaseapp.com",
  projectId: "yanarafashion-54acf",
  storageBucket: "yanarafashion-54acf.firebasestorage.app",
  messagingSenderId: "1017878347517",
  appId: "1:1017878347517:web:31e4b2ccfcac5c4b634894"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<script>
// ── AUTH ──
function getCurrentUser(){
  try{return JSON.parse(localStorage.getItem("yanara-current-user")||"null");}catch(e){return null;}
}
function clearCurrentUser(){
  try{localStorage.removeItem("yanara-current-user");}catch(e){}
}

// ── INIT ──
(function init(){
  const user = getCurrentUser();
  if(!user){
    window.location.href = "login.html";
    return;
  }
  // Set profile header
  document.getElementById("acc-avatar").textContent = (user.name||"U").charAt(0).toUpperCase();
  document.getElementById("acc-name").textContent = user.name || "—";
  document.getElementById("acc-email").textContent = user.email || "—";

  // Load saved profile extras
  const extras = getSavedProfile();
  document.getElementById("prof-name").value = user.name || "";
  document.getElementById("prof-email").value = user.email || "";
  document.getElementById("prof-phone").value = extras.phone || "";
  document.getElementById("prof-city").value = extras.city || "";

  // Theme
  const t = localStorage.getItem("yanara-theme");
  if(t === "light") document.documentElement.setAttribute("data-theme","light");
  updateThemeIcon();

  // Load wishlist and orders
  loadWishlist();
  loadOrders();
})();

// ── LOGOUT ──
function doLogout(){
  clearCurrentUser();
  window.location.href = "login.html";
}

// ── TABS ──
function switchTab(name){
  document.querySelectorAll(".tab").forEach((t,i)=>{
    const names = ["profile","wishlist","orders"];
    t.classList.toggle("on", names[i] === name);
  });
  document.querySelectorAll(".tab-section").forEach(s => s.classList.remove("on"));
  document.getElementById("tab-"+name).classList.add("on");
}

// ── PROFILE SAVE ──
function getSavedProfile(){
  try{return JSON.parse(localStorage.getItem("yanara-profile-extras")||"{}");}catch(e){return {};}
}
function saveProfile(){
  const user = getCurrentUser();
  if(!user) return;
  const name = document.getElementById("prof-name").value.trim();
  const phone = document.getElementById("prof-phone").value.trim();
  const city = document.getElementById("prof-city").value.trim();
  // Update name in current user
  user.name = name || user.name;
  localStorage.setItem("yanara-current-user", JSON.stringify(user));
  // Save extras
  localStorage.setItem("yanara-profile-extras", JSON.stringify({phone, city}));
  // Update header
  document.getElementById("acc-name").textContent = user.name;
  document.getElementById("acc-avatar").textContent = (user.name||"U").charAt(0).toUpperCase();
  toast("Profile saved ✓");
}

// ── WISHLIST ──
async function loadWishlist(){
  const user = getCurrentUser();
  const el = document.getElementById("wishlist-content");
  if(!user){el.innerHTML = emptyState("ti-heart","No Wishlist","Login to save your favourites","Shop Now");return;}
  try{
    const snap = await db.collection("wishlists").doc(user.email).collection("items").get();
    if(snap.empty){
      el.innerHTML = emptyState("ti-heart","Your wishlist is empty","Save products you love by clicking the ♡ button","Shop Now");
      return;
    }
    const items = [];
    snap.forEach(d => items.push({...d.data(), docId: d.id}));
    el.innerHTML = `<div class="wishlist-grid">${items.map(p=>`
      <div class="wish-card" onclick="window.location.href='index.html'">
        ${p.img ? `<img class="wish-img" src="${p.img}" alt="${p.name}" onerror="this.style.display='none'">` : `<div class="wish-img-ph">👔</div>`}
        <div class="wish-info">
          <div class="wish-name">${p.name||"Product"}</div>
          <div class="wish-price">₹${Number(p.price||0).toLocaleString("en-IN")}</div>
        </div>
        <button class="wish-remove" onclick="event.stopPropagation();removeWishlist('${p.docId}')">Remove</button>
      </div>`).join("")}</div>`;
  }catch(e){
    el.innerHTML = `<div class="loading">Error loading wishlist.</div>`;
  }
}

async function removeWishlist(docId){
  const user = getCurrentUser();
  if(!user) return;
  try{
    await db.collection("wishlists").doc(user.email).collection("items").doc(docId).delete();
    toast("Removed from wishlist");
    loadWishlist();
  }catch(e){toast("Error removing item");}
}

// ── ORDERS ──
async function loadOrders(){
  const user = getCurrentUser();
  const el = document.getElementById("orders-content");
  if(!user){el.innerHTML = emptyState("ti-shopping-bag","No Orders","Your orders will appear here after checkout","Shop Now");return;}
  try{
    const snap = await db.collection("orders").where("userEmail","==",user.email).get();
    if(snap.empty){
      el.innerHTML = emptyState("ti-shopping-bag","No orders yet","Your orders will appear here after you make a purchase","Shop Now");
      return;
    }
    const orders = [];
    snap.forEach(d => orders.push({...d.data(), docId: d.id}));
    orders.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    el.innerHTML = orders.map(o=>`
      <div class="order-card">
        <div class="order-header">
          <div>
            <div class="order-id">Order #${o.orderId||o.docId}</div>
            <div class="order-date">${o.date||"—"}</div>
          </div>
          <span class="order-status status-${(o.status||"pending").toLowerCase()}">${o.status||"Pending"}</span>
        </div>
        <div class="order-items">${(o.items||[]).map(i=>`${i.name} × ${i.qty}`).join(", ")||"—"}</div>
        <div class="order-total">Total: ₹${Number(o.total||0).toLocaleString("en-IN")}</div>
      </div>`).join("");
  }catch(e){
    el.innerHTML = `<div class="loading">Error loading orders.</div>`;
  }
}

// ── EMPTY STATE ──
function emptyState(icon, title, sub, btnText){
  return `<div class="empty">
    <div class="empty-icon"><i class="ti ${icon}"></i></div>
    <div class="empty-title">${title}</div>
    <div class="empty-sub">${sub}</div>
    <button class="empty-btn" onclick="window.location.href='index.html?page=shop'">${btnText}</button>
  </div>`;
}

// ── TOAST ──
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2500);
}

// ── THEME ──
function toggleTheme(){
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", isLight ? "" : "light");
  localStorage.setItem("yanara-theme", isLight ? "" : "light");
  updateThemeIcon();
}
function updateThemeIcon(){
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  document.getElementById("theme-btn").innerHTML = isLight ? '<i class="ti ti-sun"></i>' : '<i class="ti ti-moon"></i>';
}
</script>
</body>
</html>
