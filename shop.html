<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop | YANARA Fashions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    
    </head>
<body>

    <div id="header-placeholder"></div>

    <main class="page active" id="page-shop" style="padding-top: 100px;">
        <div class="shop-header" style="text-align:center; padding:40px 20px;">
            <h1 style="font-family:serif; color:var(--gold); letter-spacing:4px;">OUR COLLECTION</h1>
            <p style="color:var(--gray); font-size:12px; margin-top:10px;">Luxury Ethnic Wear Curated for You</p>
        </div>

        <div id="shop-grid" class="pgrid"></div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="yanara-fixes.js"></script>
    <script src="yanara-colors.js"></script>
    <script>
        // Deep Explanation: This small script tells the page to 
        // immediately show the products once the page opens.
        document.addEventListener("DOMContentLoaded", () => {
            if(typeof renderShop === 'function') {
                renderShop();
            }
        });
    </script>
</body>
</html>
