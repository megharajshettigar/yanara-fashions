<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>YANARA Fashions | Premium Ethnic Wear</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <style>
        :root {
            --bg: #0d0d0d; --bg2: #141414; --gold: #c9a96e; --white: #f5f5f5; 
            --gray: #888; --border: rgba(255,255,255,0.07); --font: "Segoe UI", sans-serif;
        }
        body { background: var(--bg); color: var(--white); font-family: var(--font); margin: 0; overflow-x: hidden; }
        .hero { position: relative; height: 80vh; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .hero video { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .h-cont { position: absolute; text-align: center; width: 100%; padding: 20px; z-index: 2; }
        .cbtn { background: var(--gold); border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; letter-spacing: 1px; transition: 0.3s; }
        .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .o-card { cursor: pointer; position: relative; border: 1px solid var(--border); transition: 0.3s; }
        .o-card img { width: 100%; height: 400px; object-fit: cover; display: block; }
        .o-label { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; font-weight: bold; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="page active" id="page-home">
        <section class="hero">
            <video autoplay muted loop playsinline src="images/yanara-hero.mp4"></video>
            <div class="h-cont">
                <h1 style="font-family: serif; letter-spacing: 8px; font-size: 3rem; text-transform: uppercase;">The Luxe Edit</h1>
                <p style="letter-spacing: 3px; font-size: 14px; margin-bottom: 30px;">Curated Indian Elegance</p>
                <button class="cbtn" onclick="location.href='shop.html'">SHOP NOW</button>
            </div>
        </section>

        <section style="padding: 80px 20px; text-align: center;">
            <h2 style="font-family: serif; letter-spacing: 4px; margin-bottom: 40px; color: var(--gold);">SHOP BY OCCASION</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto;">
                <div class="o-card" onclick="location.href='shop.html'">
                    <img src="images/wedding.jpg" alt="Wedding">
                    <div class="o-label">WEDDING WEAR</div>
                </div>
                <div class="o-card" onclick="location.href='shop.html'">
                    <img src="images/festive.jpg" alt="Festive">
                    <div class="o-label">FESTIVE CURATION</div>
                </div>
            </div>
        </section>

        <section style="padding: 40px 0;">
            <h2 style="text-align: center; font-family: serif; letter-spacing: 4px; margin-bottom: 40px;">NEW ARRIVALS</h2>
            <div class="pgrid" id="new-arrivals">
                </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="yanara-colors.js"></script>
    <script src="yanara-fixes.js"></script>

</body>
</html>
