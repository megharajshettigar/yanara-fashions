<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>YANARA Fashions | Premium Ethnic Wear</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <style>
        :root { --bg: #0d0d0d; --bg2: #141414; --gold: #c9a96e; --white: #f5f5f5; --border: rgba(255,255,255,0.07); }
        body { background: var(--bg); color: var(--white); font-family: sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Header Styling */
        nav { position: sticky; top: 0; background: rgba(13,13,13,0.95); display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; z-index: 1000; border-bottom: 1px solid var(--border); }
        .logo { font-family: serif; font-size: 24px; color: var(--gold); letter-spacing: 2px; cursor: pointer; }
        .nl { display: flex; gap: 30px; list-style: none; }
        .nl a { color: var(--white); text-decoration: none; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        /* Hero Styling */
        .hero { position: relative; height: 80vh; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .hero video { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .h-cont { position: absolute; text-align: center; z-index: 2; }
        .cbtn { background: var(--gold); border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; }

        /* Grid Styling */
        .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 40px 5%; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="location.href='index.html'">YANARA</div>
        <ul class="nl">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="designer.html">Designer</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
        <div class="nr">Cart</div>
    </nav>

    <main>
        <section class="hero">
            <video autoplay muted loop playsinline src="images/yanara-hero.mp4"></video>
            <div class="h-cont">
                <h1 style="font-family:serif; letter-spacing:8px; font-size:3rem;">THE LUXE EDIT</h1>
                <p style="margin-bottom:30px;">Curated Indian Elegance</p>
                <button class="cbtn" onclick="location.href='shop.html'">SHOP NOW</button>
            </div>
        </section>

        <h2 style="text-align:center; margin-top:60px; font-family:serif; letter-spacing:4px;">NEW ARRIVALS</h2>
        <div class="pgrid" id="new-arrivals">
            </div>
    </main>

    <footer style="padding: 60px 5%; border-top: 1px solid var(--border); background: var(--bg2); margin-top: 80px; text-align: center;">
        <h3 style="color:var(--gold); font-family:serif;">YANARA Fashions</h3>
        <p style="font-size:12px; color:var(--gray);">Premium Ethnic Wear by Ramya</p>
    </footer>

    <script src="yanara-colors.js"></script>
    <script src="yanara-fixes.js"></script>
</body>
</html>
